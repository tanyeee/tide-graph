<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/tide-graph-apple-touch-icon-v20260711.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/tide-graph-favicon-32-v20260711.png">
<link rel="manifest" href="site.webmanifest?v=20260711">
<title>日立 潮位グラフ</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f6f8fb;
    --text:#111827;
    --card:#ffffff;
    --line:#1f2937;
    --muted:#6b7280;
    --grid:#d7dde6;
    --accent:#2563eb;
    --accent-soft:#dbeafe;
    --border:#e5e7eb;
    --canvas-bg:#ffffff;
    --chart-bg:#1a5276;
    --pill:#f9fafb;
    --highlight:#facc15;
    --river:#0284c7;
    --now:#dc2626;
    --button-bg:#ffffff;
    --button-text:#111827;
    --shadow:0 6px 20px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1220;
      --text:#e5edf7;
      --card:#111827;
      --line:#e5edf7;
      --muted:#94a3b8;
      --grid:#334155;
      --accent:#3b82f6;
      --accent-soft:#1e3a8a;
      --border:#334155;
      --canvas-bg:#0f172a;
      --pill:#0f172a;
      --highlight:#fde047;
      --river:#38bdf8;
      --now:#ef4444;
      --button-bg:#0f172a;
      --button-text:#e5edf7;
      --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text);
  }
  .wrap { max-width:1100px; margin:0 auto; }
  .card {
    background:transparent; border:0; border-radius:0;
    padding:0; box-shadow:none;
  }
  h1 { margin:0 0 4px; font-size:clamp(24px,3vw,34px); text-align:center; }
  .sub, .legend, .note { color:var(--muted); font-size:14px; line-height:1.7; }
  .sub { margin-top:18px; }
  .legend { font-size:14px; margin-top:16px; }
  .river-footnote { color:#60a5fa; font-size:14px; line-height:1.7; margin-top:18px; }
  .note { margin-top:12px; font-size:14px; }
  .river-status { margin-top:0; }
  .data-status[data-state="error"], .river-status[data-state="error"] { color:#dc2626; font-weight:700; }
  .data-status[data-state="warning"], .river-status[data-state="warning"] { color:#d97706; font-weight:700; }
  .controls {
    display:flex; flex-wrap:wrap; gap:12px; align-items:end; justify-content:center; margin-bottom:18px;
  }
  .field {
    display:flex; flex-direction:column; gap:6px; min-width:0;
  }
  label { font-size:14px; color:var(--muted); }
  input[type="date"], select {
    font-size:16px; padding:10px 12px; border:1px solid var(--border); border-radius:10px;
    background:var(--button-bg); color:var(--button-text);
  }
  select { min-width:150px; height:44px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .toggle { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:3px; min-width:116px; padding:3px; border:1px solid var(--border); border-radius:999px; background:var(--pill); }
  .toggle button { border:0; background:transparent; color:var(--muted); padding:8px 10px; border-radius:999px; font-weight:700; }
  .toggle button.active { background:var(--accent); color:#fff; }
  .range-row { display:flex; flex-wrap:wrap; align-items:end; gap:12px; margin-top:16px; margin-bottom:18px; }
  .range-row .field > label, .pill .k { text-align:center; }
  /* flex-basis:0 (not a fixed px value) lets this field shrink down to
     whatever room is left after the 表示範囲 buttons and 更新 button take
     their space, instead of forcing its own line. min-width:0 is required
     too: without it, flex items default to min-width:auto, which floors
     their size at their content's natural width and defeats shrinking. */
  .river-field { flex:1 1 0; min-width:0; }
  .river-field label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .river-mode-field label { white-space:nowrap; }
  .river-field select {
    min-width:0; width:100%;
    text-overflow:ellipsis; overflow:hidden; white-space:nowrap;
    font-size:18px;
    /* text-align centers the selected value in browsers that honor it on a
       closed <select> (incl. iOS Safari); text-align-last is the fallback
       property some engines use instead for the last (only, here) line. */
    text-align:center; text-align-last:center;
  }
  .refresh-wrap { margin-left:auto; }
  .refresh-btn { min-width:64px; height:44px; border-radius:14px; font-size:22px; font-weight:700; padding:0 14px; }
  /* The explanation icon shares the date navigation's three columns, so it
     stays aligned with the central date/tide control at every breakpoint. */
  .date-nav-field {
    width:min(100%, 520px);
    --date-nav-cols:88px minmax(0, 1fr) 88px;
    --date-nav-gap:12px;
  }
  .date-nav-info-row {
    display:grid; grid-template-columns:var(--date-nav-cols); gap:var(--date-nav-gap);
    justify-content:start; margin-bottom:-4px;
  }
  .date-info-anchor { grid-column:2; position:relative; display:flex; justify-content:flex-end; }
  .date-info-btn {
    flex:0 0 auto; width:44px; height:44px; padding:0;
    border:0; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
  }
  .date-info-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* The tappable button above is 44px (accessibility minimum); the visible
     circle inside it is the smaller ~20px glyph the design calls for. */
  .date-info-icon {
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted);
    color:var(--muted); font-size:12px; font-weight:800; line-height:1; font-style:normal;
  }
  .date-info-btn:hover .date-info-icon,
  .date-info-btn[aria-expanded="true"] .date-info-icon {
    border-color:var(--accent); color:var(--accent); background:var(--accent-soft);
  }
  /* Centered under the button (rather than right/left-anchored) so it stays
     clear of the viewport edge whichever side the button ends up closer to
     — see the position-tuning commit's write-up for the 375px/1100px
     coordinate check that motivated centering over edge-anchoring. */
  .date-info-popover {
    position:absolute; top:100%; left:50%; transform:translateX(-50%); z-index:5; margin-top:4px;
    width:max-content; max-width:min(220px, calc(100vw - 32px));
    padding:10px 14px; border-radius:12px; text-align:center;
    background:var(--pill); border:1px solid var(--border); box-shadow:var(--shadow);
    color:var(--text); font-size:13px; line-height:1.6;
  }
  .date-info-popover[hidden] { display:none; }
  .date-nav { display:grid; grid-template-columns:var(--date-nav-cols); align-items:center; gap:var(--date-nav-gap); justify-content:start; }
  /* Date navigation buttons name their destination date directly. */
  .date-nav > button {
    min-width:0; min-height:48px; padding:8px 6px; font-weight:700; border-radius:14px;
    white-space:nowrap;
  }
  .nav-step { font-size:10px; font-weight:600; line-height:1.15; }
  /* Desktop uses the visible button's showPicker() call. Touch-first devices
     instead receive the real date input directly (see the capability query
     below), which is required by iOS Safari's native picker. */
  .date-display-wrap {
    position:relative; min-width:0; align-self:stretch;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .date-display {
    appearance:none; border:0; background:transparent; padding:0;
    font:inherit; cursor:pointer; text-align:center; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center; gap:12px; white-space:nowrap;
  }
  .date-display-value { font-size:20px; font-weight:800; color:var(--text); }
  .date-tide-name { color:var(--highlight); font-size:24px; font-weight:800; letter-spacing:.08em; line-height:1.1; }
  .date-nav input[type="date"] {
    position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border:0;
    opacity:0; pointer-events:none; -webkit-appearance:none; appearance:none;
  }
  @media (hover: none) and (pointer: coarse) {
    /* iOS Safari permits its date sheet only from a direct tap on the native
       control. Keep the button for its label/value, but route the touch to
       the transparent input layered above it. */
    .date-display { pointer-events:none; }
    .date-nav input[type="date"] { pointer-events:auto; cursor:pointer; }
  }
  button {
    appearance:none; border:1px solid var(--border); background:var(--button-bg); color:var(--button-text);
    padding:10px 14px; border-radius:999px; cursor:pointer; font-size:15px;
  }
  button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .meta {
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:14px;
  }
  .pill {
    background:var(--pill); border:1px solid var(--border); border-radius:14px; padding:12px 14px;
  }
  .pill .k { color:var(--muted); font-size:12px; margin-bottom:4px; }
  .pill .v { font-size:18px; font-weight:700; text-align:center; }
  #selectedHeight {
    color:var(--highlight);
    font-size:24px;
    font-weight:800;
  }
  #selectedRiverHeight { color:var(--river); }
  .footnote-mark { font-size:.72em; vertical-align:super; line-height:0; }
  .swatch { display:inline-block; width:1.4em; height:.22em; margin:0 .35em .18em 0; vertical-align:middle; border-radius:999px; }
  .swatch.tide { background:var(--highlight); }
  .swatch.river { background:var(--river); }
  .legend-symbol {
    display:inline-flex; width:1.65em; height:1em; margin:0 .3em -.1em 0;
    position:relative; align-items:center; justify-content:center; vertical-align:baseline;
  }
  /* Selection swatch: a vertical line with the selected-point dot on top,
     matching the actual chart marker (a solid --muted vertical line drawn
     from drawSelection, topped with a --highlight dot). */
  .legend-symbol.selection::before {
    content:""; position:absolute; top:0; bottom:0; left:50%; width:2px;
    transform:translateX(-50%); background:var(--muted);
  }
  .legend-symbol.selection::after {
    content:""; position:relative; width:.72em; height:.72em; border-radius:50%; background:var(--highlight);
  }
  /* Now-time swatch: a solid dot only, matching the canvas dot drawn by
     drawNowIndicator() / the #nowPulse ring (the dashed line this used to
     also show was removed from the chart, so the legend no longer needs it
     either). */
  .legend-symbol.now::after {
    content:""; position:relative; width:.68em; height:.68em; border-radius:50%; background:var(--now);
  }
  .chart-stack {
    position:relative; width:calc(100% + 48px); margin:0 -24px 16px;
    overflow:hidden;
  }
  #chart {
    width:100%; height:auto; display:block; border:0; border-radius:0; background:var(--chart-bg);
    touch-action:manipulation;
  }
  .now-pulse {
    --pulse-scale:4.44;
    position:absolute; display:none; z-index:2; pointer-events:none;
    border:2px solid rgba(255,255,255,.5); border-radius:50%;
    transform:translate(-50%,-50%) scale(1);
    animation:now-pulse 3s ease-out infinite;
  }
  @keyframes now-pulse {
    0% { opacity:1; transform:translate(-50%,-50%) scale(1); }
    50% { opacity:0; transform:translate(-50%,-50%) scale(var(--pulse-scale)); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(var(--pulse-scale)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .now-pulse { display:none !important; animation:none; }
  }
  .chart-controls {
    position:absolute; left:20px; right:20px; bottom:24px; z-index:2;
    display:grid; grid-template-columns:76px minmax(0, 1fr) 76px; align-items:center; gap:20px;
  }
  .chart-meta {
    position:absolute; left:76px; right:76px; bottom:124px; z-index:2;
    margin:0;
  }
  .chart-step-button {
    min-height:76px; padding:6px 0; border-radius:20px;
    border-color:rgba(255,255,255,.4); background:rgba(7,30,54,.72); color:#fff;
    font-weight:700; line-height:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .chart-step-button .nav-arrow { font-size:40px; line-height:1; }
  .chart-control-legend {
    display:grid; grid-template-columns:repeat(2, max-content); justify-content:center; column-gap:24px; row-gap:10px;
    color:rgba(255,255,255,.88); font-size:20px; line-height:1.1;
  }
  .chart-legend-item { display:flex; align-items:center; white-space:nowrap; }
  .chart-control-legend .swatch { margin-bottom:0; }
  .chart-control-legend .legend-symbol { margin-bottom:0; }
  @media (max-width: 780px) {
    body { padding:12px; }
    .card { padding:0; border-radius:0; }
    .chart-stack { width:calc(100% + 24px); margin-left:-12px; margin-right:-12px; }
    .chart-meta { left:16px; right:16px; bottom:80px; }
    .meta { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .range-row { width:100%; justify-content:space-between; }
    #selectedHeight { font-size:22px; }
    .date-nav-field { --date-nav-cols:76px minmax(0, 1fr) 76px; --date-nav-gap:8px; }
  }
  @media (max-width: 560px) {
    h1 { font-size:24px; white-space:nowrap; }
    .date-nav-field { --date-nav-cols:64px minmax(0,1fr) 64px; --date-nav-gap:4px; }
    .date-nav-info-row { width:100%; }
    .date-nav { width:100%; }
    .date-nav > button { min-height:44px; padding:8px 2px; font-size:13px; }
    .date-display { gap:7px; }
    .date-display-value { font-size:18px; }
    .date-tide-name { font-size:21px; }
    /* Keep all four river controls in one row on phone widths.  Grid makes
       the intended order explicit: range, mode, station, then refresh.
       The station column alone absorbs the remaining width, so it never
       forces the whole field onto a second line. */
    .range-row {
      display:grid;
      grid-template-columns:max-content max-content minmax(72px, 1fr) 44px;
      align-items:end;
      gap:4px;
    }
    .range-row .btns { gap:4px; }
    .range-row button { padding:9px 5px; white-space:nowrap; font-size:14px; }
    .range-row .toggle { min-width:0; gap:2px; padding:2px; }
    .range-row .toggle button { padding:8px 4px; }
    .range-row .field { min-width:0; }
    .refresh-btn { min-width:44px; width:44px; padding:0 8px; }
    .river-mode-field { order:1; }
    .river-field { order:2; min-width:0; }
    .river-field label { font-size:14px; }
    .river-field select { padding:10px 8px; font-size:16px; }
    .refresh-wrap { order:3; margin-left:0; }
    .meta { grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .pill { min-width:0; padding:10px; }
    .pill .v { font-size:16px; white-space:nowrap; }
    #selectedHeight { font-size:20px; }
    .chart-controls { left:10px; right:10px; bottom:12px; grid-template-columns:56px minmax(0,1fr) 56px; gap:6px; }
    .chart-step-button { min-height:56px; border-radius:16px; }
    .chart-step-button .nav-arrow { font-size:30px; }
    .chart-step-button .nav-step { font-size:10px; }
    .chart-control-legend { grid-template-columns:repeat(2, max-content); column-gap:10px; row-gap:7px; font-size:13px; }
    .chart-control-legend .swatch { margin-right:.25em; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>日立 潮位＆河川水位グラフ</h1>

    <div class="controls">
      <div class="field date-nav-field">
        <div class="date-nav-info-row">
          <div class="date-info-anchor">
            <button id="dateInfoButton" class="date-info-btn" type="button" aria-label="日付変更の説明" aria-expanded="false" aria-describedby="dateInfoPopover">
              <span class="date-info-icon" aria-hidden="true">ⓘ</span>
            </button>
            <div id="dateInfoPopover" class="date-info-popover" role="tooltip" hidden>
              日付をクリックまたはタップするとカレンダーから変更可能
            </div>
          </div>
        </div>
        <div class="date-nav">
          <button id="btnPrev1" type="button" aria-label="前日" disabled>＜</button>
          <div class="date-display-wrap">
            <button id="datePickerButton" class="date-display" type="button" aria-label="日付を選択" disabled><span id="dateDisplay" class="date-display-value">-</span><span id="tideName" class="date-tide-name" aria-label="潮名">-</span></button>
            <input id="dateInput" type="date" disabled tabindex="-1" aria-hidden="true">
          </div>
          <button id="btnNext1" type="button" aria-label="翌日" disabled>＞</button>
        </div>
      </div>
    </div>

    <div class="chart-stack">
      <canvas id="chart" width="1040" height="1000" aria-label="天文潮位と河川水位の比較グラフ"></canvas>
      <div id="nowPulse" class="now-pulse" aria-hidden="true"></div>
      <div class="meta chart-meta">
        <div class="pill"><div class="k">選択時刻</div><div class="v" id="selectedTime">-</div></div>
        <div class="pill"><div class="k">海洋潮位</div><div class="v" id="selectedHeight">-</div></div>
        <div class="pill"><div class="k">河川水位 <sup class="footnote-mark" id="riverFootnoteMark">※1</sup></div><div class="v" id="selectedRiverHeight">-</div></div>
      </div>
      <div class="chart-controls" aria-label="グラフの凡例と時刻操作">
        <button id="btnPrev10" class="chart-step-button" type="button" aria-label="10分前"><span class="nav-step">10分</span><span class="nav-arrow">&lt;</span></button>
        <div class="chart-control-legend" aria-label="凡例">
          <span class="chart-legend-item"><span class="swatch tide"></span>海洋潮位</span>
          <span class="chart-legend-item"><span class="legend-symbol now" aria-hidden="true"></span>現在時刻</span>
          <span class="chart-legend-item"><span class="swatch river"></span>河川水位</span>
          <span class="chart-legend-item"><span class="legend-symbol selection" aria-hidden="true"></span>選択時刻</span>
        </div>
        <button id="btnNext10" class="chart-step-button" type="button" aria-label="10分後"><span class="nav-step">10分</span><span class="nav-arrow">&gt;</span></button>
      </div>
    </div>

    <div class="range-row">
      <div class="field">
        <label>表示日数</label>
        <div class="toggle" role="group" aria-label="表示日数">
          <button id="btn1" class="active" type="button">1日</button>
          <button id="btn2" type="button">2日</button>
        </div>
      </div>
      <div class="field river-field">
        <label for="riverStation">河川水位観測地点</label>
        <select id="riverStation">
          <option value="">表示しない</option>
          <optgroup label="久慈川水系">
            <option value="kuji-ohashi" selected>久慈大橋</option>
            <option value="sakakibashi">榊橋</option>
          </optgroup>
          <optgroup label="涸沼・那珂川水系">
            <option value="hinuma-bashi">涸沼橋</option>
            <option value="minato-ohashi">湊大橋</option>
            <option value="suifu-bashi">水府橋</option>
            <option value="kunita-ohashi">国田大橋</option>
          </optgroup>
        </select>
      </div>
      <div class="field river-mode-field">
        <label>水位モード</label>
        <div class="toggle" role="group" aria-label="水位モード">
          <button id="riverModeRelative" class="active" type="button">相対</button>
          <button id="riverModeActual" type="button">実水位</button>
        </div>
      </div>
      <div class="field refresh-wrap">
        <label>更新</label>
        <button id="btnReload" class="refresh-btn" type="button" aria-label="再読み込み">↻</button>
      </div>
    </div>

    <div id="riverFootnoteText" class="river-footnote">※1 河川水位は、潮位との時刻差を比較しやすくするためグラフ上で縦方向に自動調整した表示値です。実際の河川水位を示すものではありません。参考指標として利用ください。</div>
    <div id="dataStatus" class="note data-status" role="status" aria-live="polite">
      潮位データを読み込んでいます…
    </div>
    <div id="riverStatus" class="note river-status" role="status" aria-live="polite"></div>
    <div class="legend">
      出典<br>
      潮位：<a href="https://www.data.jma.go.jp/kaiyou/db/tide/suisan/suisan.php?stn=D1" target="_blank" rel="noopener noreferrer">気象庁「潮位表 日立」</a><br>
      潮名：<a href="https://www.mirc.jp/online/w/w-tide/knowledge/SN-det.html" target="_blank" rel="noopener noreferrer">日本水路協会 MIRC「科学的な潮名の決め方」</a><br>
      水位：<a href="https://tanyeee.github.io/kuji-waterlevel/" target="_blank" rel="noopener noreferrer">国土交通省データを利用した久慈川水位ビューア</a>
    </div>
  </div>
</div>

<script type="module">
import {
  STATION,
  jmaTextUrl,
  parseJmaTideText,
  validateTideRecords
} from './js/tide-parser.js';
import {
  RIVER_STATIONS,
  axisTicks,
  calculateRiverAxis,
  extendFixedRiverRange,
  riverLevelToDisplayHeight,
  normalizeRiverPayload,
  pairRiverWithTide,
  riverSeriesForWindow
} from './js/river-water-level.js';
import { getTimes, getMoonTimes, getMoonIllumination } from './js/suncalc.js';
import { getScientificTideName } from './js/tide-names.js';
import {
  interpolateHeightAtMinute,
  shouldScheduleMarkerRefresh

async function fetchJson(url) {
  const response = await fetch(url, { cache: 'no-cache' });
  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  return response.json();
}

async function loadRiverStation(stationId) {
  const requestId = ++riverRequestId;
  riverRecords = [];
  riverMeta = {};
  if (currentSeries.length) refresh(false);
  if (!stationId) {
    setRiverStatus('河川水位は非表示です。');
    return;
  }

  const station = RIVER_STATIONS[stationId];
  if (!station) return;
  setRiverStatus(`${station.name}の10分水位を読み込んでいます…`);
  try {
    const payload = normalizeRiverPayload(await fetchJson(station.url));
    if (requestId !== riverRequestId) return;
    riverRecords = payload.records;
    riverMeta = payload.meta;
    const start = riverMeta.dataset_start?.replace('T', ' ') || riverRecords[0]?.timestamp.replace('T', ' ');
    const end = riverMeta.dataset_end?.replace('T', ' ') || riverRecords.at(-1)?.timestamp.replace('T', ' ');
    const windowHours = riverMeta.window_hours || 24;
    setRiverStatus(`${station.name}：${start || '—'}〜${end || '—'}（10分観測、保持設定${windowHours}時間）`);
  } catch (error) {
    if (requestId !== riverRequestId) return;
    console.error(error);
    setRiverStatus(`${station.name}の水位データを読み込めませんでした。潮位のみ表示します。`, 'error');
  }
  if (currentSeries.length) refresh(false);
}

async function loadTideYear(year) {
  if (yearCache.has(year)) return yearCache.get(year);

  let records;
  try {
    const payload = await fetchJson(`./data/tides-${year}.json`);
    if (payload.schemaVersion !== 1 || payload.year !== year || payload.station?.code !== STATION.code) {
      throw new Error(`Invalid cached metadata for ${year}`);
    }
    records = validateTideRecords(payload.days, year);
  } catch (cacheError) {
    const response = await fetch(jmaTextUrl(year), { mode: 'cors', cache: 'no-cache' });
    if (!response.ok) {
      throw new Error(`Unable to load ${year}: local cache failed (${cacheError.message}); JMA returned ${response.status}`);
    }
    records = parseJmaTideText(await response.text(), year);
  }

  yearCache.set(year, records);
  return records;
}

async function loadManifestYears() {
  try {
    const manifest = await fetchJson('./data/manifest.json');
    if (manifest.schemaVersion !== 1 || manifest.station !== STATION.code || !Array.isArray(manifest.years)) {
      throw new Error('Invalid manifest');
    }
    return manifest.years.filter(Number.isInteger);
  } catch (error) {
    return [];
  }
}

async function initializeData() {
  const currentYear = new Date().getFullYear();
  const manifestYears = await loadManifestYears();
  const candidateYears = new Set(
    manifestYears.filter(year => year >= currentYear - 1 && year <= currentYear + 1)
  );
  candidateYears.add(currentYear);
  candidateYears.add(currentYear + 1);

  const results = await Promise.allSettled(
    [...candidateYears].sort((a, b) => a - b).map(year => loadTideYear(year))
  );
  tideData = results
    .filter(result => result.status === 'fulfilled')
    .flatMap(result => result.value)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (!tideData.length) throw new Error('利用可能な潮位データがありません。');

  dataMap = Object.fromEntries(tideData.map(record => [record.date, record]));
  const firstDate = tideData[0].date;
  const lastDate = tideData[tideData.length - 1].date;
  dateInput.min = firstDate;
  dateInput.max = lastDate;
  dateInput.disabled = false;
  datePickerButton.disabled = false;
  const defaultState = setDefaultDate();
  const rangeMessage = `収録範囲：${jpDate(firstDate)}〜${jpDate(lastDate)}`;
  if (defaultState === 'today') {
    setDataStatus(rangeMessage);
  } else {
    setDataStatus(`本日のデータは収録範囲外です。最も近い日付を表示しています。${rangeMessage}`, 'warning');
  }
  refresh();
  await loadRiverStation(riverStationSelect.value);
}

function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function pad(n) {
  return String(n).padStart(2, '0');
}

function jpDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${w}）`;
}

function shortJpDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getMonth() + 1}月${d.getDate()}日（${w}）`;
}

function addDays(dateStr, add) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + add);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// Updates the central date plus its tide name, then gives each adjacent-day
// button the concrete date it will select.
function updateDateDisplay() {
  if (!dateInput.value) return;
  dateDisplayEl.textContent = shortJpDate(dateInput.value);
  const previous = addDays(dateInput.value, -1);
  const next = addDays(dateInput.value, 1);
  const hasPrevious = !!dataMap[previous];
  const hasNext = !!dataMap[next];

  btnPrev1.disabled = !hasPrevious;
  btnPrev1.textContent = hasPrevious ? `＜${new Date(previous + 'T00:00:00').getDate()}日` : '＜';
  btnPrev1.setAttribute('aria-label', hasPrevious ? `前日（${shortJpDate(previous)}）` : '前日（利用可能なデータなし）');
  btnNext1.disabled = !hasNext;
  btnNext1.textContent = hasNext ? `${new Date(next + 'T00:00:00').getDate()}日＞` : '＞';
  btnNext1.setAttribute('aria-label', hasNext ? `翌日（${shortJpDate(next)}）` : '翌日（利用可能なデータなし）');
}

function setDefaultDate() {
  const now = new Date();
  const today = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const firstDate = tideData[0]?.date;
  const lastDate = tideData[tideData.length - 1]?.date;
  if (dataMap[today]) {
    dateInput.value = today;
    return 'today';
  } else if (today < firstDate) {
    dateInput.value = firstDate;
    return 'before';
  } else {
    dateInput.value = lastDate;
    return 'after';
  }
}

function buildSeries(startDate, days) {
  const out = [];
  for (let d = 0; d < days; d++) {
    const dateStr = addDays(startDate, d);
    const rec = dataMap[dateStr];
    if (!rec) continue;
    const nextDateStr = addDays(dateStr, 1);
    const nextRec = dataMap[nextDateStr];
    for (let h = 0; h < 24; h++) {
      const h0 = rec.hours[h];
      const h1 = (h < 23) ? rec.hours[h + 1] : (nextRec ? nextRec.hours[0] : rec.hours[23]);
      for (let m = 0; m < 60; m += 10) {
        const t = d * 24 * 60 + h * 60 + m;
        const frac = m / 60;
        const height = h0 + (h1 - h0) * frac;
        const hh = pad(h);
        const mm = pad(m);
        out.push({
          minute: t,
          label: `${dateStr} ${hh}:${mm}`,
          timeOnly: `${hh}:${mm}`,
          height: Math.round(height * 10) / 10
        });
      }
    }
  }
  return out;
}

function extremaForWindow(startDate, days) {
  const extrema = [];
  for (let day = 0; day < days; day++) {
    const rec = dataMap[addDays(startDate, day)];
    if (!rec) continue;
    for (const [kind, values] of [['high', rec.highs], ['low', rec.lows]]) {
      for (const item of values) {
        const [hour, minute] = item.time.split(':').map(Number);
        extrema.push({
          kind,
          minute: day * 24 * 60 + hour * 60 + minute,
          time: item.time,
          height: item.height
        });
      }
    }
  }
  return extrema;
}

function roundedRectPath(x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + width - r, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + r);
  ctx.lineTo(x + width, y + height - r);
  ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
  ctx.lineTo(x + r, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Draw compact callouts directly beside each high/low tide. Keeping the
// time and height adjacent to the point makes the chart self-contained and
// removes the need for separate high/low lists below it.
function riverYAtMinute(minute, yFromRiverLevel) {
  if (!currentRiverAxis || !currentRiverSeries.length) return null;
  const afterIndex = currentRiverSeries.findIndex(point => point.minute >= minute);
  if (afterIndex === -1) return null;
  const after = currentRiverSeries[afterIndex];
  if (after.minute === minute) return yFromRiverLevel(after.level);
  if (afterIndex === 0) return null;
  const before = currentRiverSeries[afterIndex - 1];
  // Do not invent a line across a gap in the ten-minute observation feed.
  if (after.minute - before.minute > 20) return null;
  const ratio = (minute - before.minute) / (after.minute - before.minute);
  return yFromRiverLevel(before.level + (after.level - before.level) * ratio);
}

function drawExtremaLabels(xFromMinute, yFromHeight, yFromRiverLevel, m, plotW) {
  const boxW = 116;
  const boxH = 66;
  const pointerH = 9;
  const lineGap = 5;
  const inset = 4;
  ctx.save();
  ctx.lineWidth = 1.5;
  ctx.font = 'bold 27px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  extremaForWindow(dateInput.value, dayCount).forEach(item => {
    const pointX = xFromMinute(item.minute);
    const pointY = yFromHeight(item.height);
    const isHigh = item.kind === 'high';
    const boxX = Math.max(m.left + inset, Math.min(pointX - boxW / 2, m.left + plotW - boxW - inset));
    const riverY = riverYAtMinute(item.minute, yFromRiverLevel);
    // The pointer stops one pixel before the first waveform encountered in
    // its direction. For a high tide that is the uppermost line; for a low
    // tide it is the lowermost line. This keeps the label close while never
    // covering either the astronomical or river-water trace.
    const nearestLineY = riverY == null
      ? pointY
      : (isHigh ? Math.min(pointY, riverY) : Math.max(pointY, riverY));
    const pointerTipY = isHigh ? nearestLineY - lineGap : nearestLineY + lineGap;
    const boxY = isHigh
      ? pointerTipY - pointerH - boxH
      : pointerTipY + pointerH;
    const pointerBaseY = isHigh ? boxY + boxH : boxY;
    const pointerHalf = 6;

    // A muted blue, only slightly darker than --chart-bg, retains contrast
    // without making the labels look like heavy dark panels.
    ctx.fillStyle = 'rgba(20, 68, 98, .9)';
    ctx.strokeStyle = 'rgba(255, 255, 255, .78)';
    ctx.beginPath();
    roundedRectPath(boxX, boxY, boxW, boxH, 7);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pointX - pointerHalf, pointerBaseY);
    ctx.lineTo(pointX + pointerHalf, pointerBaseY);
    ctx.lineTo(pointX, pointerTipY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.fillText(item.time, boxX + boxW / 2, boxY + 21);
    ctx.font = 'bold 23px sans-serif';
    ctx.fillText(`${Math.round(item.height)} cm`, boxX + boxW / 2, boxY + 49);
    ctx.font = 'bold 27px sans-serif';
  });
  ctx.restore();
}

function getTideYAxisRange() {
  const minHeight = Math.min(...currentSeries.map(d => d.height));
  const maxHeight = Math.max(...currentSeries.map(d => d.height));
  const min = minHeight < 0 ? Math.floor(minHeight / 20) * 20 : 0;
  const max = Math.max(120, Math.ceil(maxHeight / 40) * 40);
  return { min, max };
}


function getInitialSelectedIndex() {
  if (!currentSeries.length) return 0;
  const now = new Date();
  const today = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const start = dateInput.value;
  const end = addDays(start, dayCount - 1);
  if (today < start || today > end) return 0;
  const offsetDays = Math.round((new Date(today + 'T00:00:00') - new Date(start + 'T00:00:00')) / 86400000);
  const minute = offsetDays * 24 * 60 + now.getHours() * 60 + now.getMinutes();
  let idx = Math.round(minute / 10);
  idx = Math.max(0, Math.min(currentSeries.length - 1, idx));
  return idx;
}

function getNowMarkerInfo() {
  const now = new Date();
  const today = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const start = dateInput.value;
  const end = addDays(start, dayCount - 1);
  if (today < start || today > end) return null;
  const offsetDays = Math.round((new Date(today + 'T00:00:00') - new Date(start + 'T00:00:00')) / 86400000);
  const minute = offsetDays * 24 * 60 + now.getHours() * 60 + now.getMinutes();
  const total = dayCount * 24 * 60;
  if (minute < 0 || minute > total) return null;
  return { minute, label: `${pad(now.getHours())}:${pad(now.getMinutes())}` };
}

function formatMeters(cm) {
  const v = cm / 100;
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

// Same "drop the trailing .0" style as formatMeters, but for a value that is
// already in meters (RIVER_STATIONS fixedRange / extendFixedRiverRange
// output), used only for 実水位 mode's right-axis tick labels.
function formatRiverMeters(m) {
  const v = Math.round(m * 10) / 10;
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

function formatClock(date) {
  return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function minuteOfLocalDay(date) {
  if (!date) return null;
  return date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60;
}

// Sun times anchored to local (JST) solar noon so the returned sunrise/sunset
// fall on the requested calendar date (SunCalc.getTimes anchors to the input
// Date's day, so noon keeps us clear of the UTC/JST day-boundary mismatch).
function getLocalSunTimes(dateStr) {
  const noon = new Date(`${dateStr}T12:00:00+09:00`);
  return getTimes(noon, SUN_MOON_LAT, SUN_MOON_LON);
}

// Maps SunCalc's moon phase (0..1, 0=new, 0.25=first quarter, 0.5=full,
// 0.75=last quarter) to one of the 8 standard moon-phase emoji. This is
// independent of the scientific tide-name calculation, which uses the
// Moon–Sun ecliptic longitude difference at JST midnight.
const MOON_PHASE_EMOJI = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];

function getMoonPhaseEmoji(dateStr) {
  const noon = new Date(`${dateStr}T12:00:00+09:00`);
  const { phase } = getMoonIllumination(noon);
  const index = Math.round(phase * 8) % 8;
  return MOON_PHASE_EMOJI[index];
}

// SunCalc.getMoonTimes scans a fixed UTC calendar day, which does not line up
// with a JST calendar day (JST = UTC+9). To find the rise/set events that fall
// within a given JST date, query the UTC day containing that date's start and
// the UTC day before it, then keep whichever events land inside the JST
// [00:00, 24:00) window for that date.
function getLocalMoonTimes(dateStr) {
  const localStart = new Date(`${dateStr}T00:00:00+09:00`);
  const localEnd = new Date(localStart.getTime() + 24 * 60 * 60 * 1000);
  const utcDayStart = new Date(`${dateStr}T00:00:00Z`);
  const utcDayPrev = new Date(utcDayStart.getTime() - 24 * 60 * 60 * 1000);

  const mtCurr = getMoonTimes(utcDayStart, SUN_MOON_LAT, SUN_MOON_LON);
  const mtPrev = getMoonTimes(utcDayPrev, SUN_MOON_LAT, SUN_MOON_LON);

  const rises = [];
  const sets = [];
  for (const mt of [mtPrev, mtCurr]) {
    if (mt.rise && mt.rise >= localStart && mt.rise < localEnd) rises.push(mt.rise);
    if (mt.set && mt.set >= localStart && mt.set < localEnd) sets.push(mt.set);
  }

  const rise = rises.length ? new Date(Math.min(...rises.map(d => d.getTime()))) : null;
  const set = sets.length ? new Date(Math.min(...sets.map(d => d.getTime()))) : null;
  let alwaysUp = false;
  let alwaysDown = false;
  if (!rise && !set) {
    alwaysUp = !!(mtCurr.alwaysUp ?? mtPrev.alwaysUp);
    alwaysDown = !!(mtCurr.alwaysDown ?? mtPrev.alwaysDown);
  }
  return { rise, set, alwaysUp, alwaysDown };
}

// Returns the "above horizon" minute-of-day interval(s) [0,1440) for a rise/set
// pair. Handles the case where the body was already up at day start and sets
// before it rises again the same day (set < rise): that yields two segments,
// [0, set] and [rise, 1440]. alwaysUp/alwaysDown cover the no-event case.
function computeUpIntervals(riseMinute, setMinute, alwaysUp) {
  if (riseMinute == null && setMinute == null) {
    return alwaysUp ? [[0, 1440]] : [];
  }
  if (riseMinute != null && setMinute != null) {
    if (riseMinute <= setMinute) return [[riseMinute, setMinute]];
    return [[0, setMinute], [riseMinute, 1440]];
  }
  if (riseMinute != null) return [[riseMinute, 1440]];
  return [[0, setMinute]];
}

// Radius of the yellow selected-tide-point dot on the chart (was 6; doubled
// per request for better visibility). No stroke/border is drawn around this
// dot, so there is nothing else to scale proportionally.
const SELECTION_DOT_RADIUS = 12;
const NOW_DOT_RADIUS = 9;
const NOW_PULSE_MAX_RADIUS = 40;

// Sun/moon bands sit in their own dedicated rows above the plot, aligned to
// the same x-axis (time) coordinates as the plot below them.
// Scaled 1.5x from the original 28/20/18/2 (band height/icon/label/gap).
const SUN_MOON_BAND_H = 42;
const SUN_MOON_ICON_PX = 30;
const SUN_MOON_LABEL_PX = 27;
const SUN_MOON_MOON_Y = 0;
const SUN_MOON_SUN_Y = SUN_MOON_MOON_Y + SUN_MOON_BAND_H + 3;
const SUN_MOON_BANDS_H = SUN_MOON_SUN_Y + SUN_MOON_BAND_H;

function drawSunMoonBand(xFromMinute, dayOffsetMin, y, color, icon, riseDate, setDate, alwaysUp) {
  const intervals = computeUpIntervals(
    minuteOfLocalDay(riseDate),
    minuteOfLocalDay(setDate),
    alwaysUp
  );
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.85;
  intervals.forEach(([a, b]) => {
    const x1 = xFromMinute(dayOffsetMin + a);
    const x2 = xFromMinute(dayOffsetMin + b);
    ctx.fillRect(x1, y, Math.max(1, x2 - x1), SUN_MOON_BAND_H);
  });
  ctx.globalAlpha = 1;

  // Emoji is centered within each visible ("above horizon") interval rather
  // than at a fixed day-center position, so it tracks the actual rise/set
  // window — including both halves of a day that wraps past midnight (set
  // then rise again). An interval narrower than the emoji glyph itself is
  // skipped rather than drawn squeezed/overlapping its rise/set labels; this
  // single width check keeps label-collision avoidance simple.
  ctx.font = `${SUN_MOON_ICON_PX}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  intervals.forEach(([a, b]) => {
    const x1 = xFromMinute(dayOffsetMin + a);
    const x2 = xFromMinute(dayOffsetMin + b);
    if (x2 - x1 < SUN_MOON_ICON_PX) return;
    const intervalCenterX = (x1 + x2) / 2;
    ctx.fillText(icon, intervalCenterX, y + SUN_MOON_BAND_H / 2 + 1);
  });

  const dayStartX = xFromMinute(dayOffsetMin);
  const dayEndX = xFromMinute(dayOffsetMin + 1440);
  // Fixed white (not the theme's --text, which is dark in light mode) since
  // the band rows sit on the always-blue --chart-bg background.
  ctx.font = `${SUN_MOON_LABEL_PX}px sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'middle';
  if (riseDate) {
    const rx = xFromMinute(dayOffsetMin + minuteOfLocalDay(riseDate));
    ctx.textAlign = 'left';
    ctx.fillText(formatClock(riseDate), Math.min(rx + 6, dayEndX - 81), y + SUN_MOON_BAND_H / 2 + 1);
  }
  if (setDate) {
    const sx = xFromMinute(dayOffsetMin + minuteOfLocalDay(setDate));
    ctx.textAlign = 'right';
    ctx.fillText(formatClock(setDate), Math.max(sx - 6, dayStartX + 81), y + SUN_MOON_BAND_H / 2 + 1);
  }
  ctx.restore();
}

function drawSunMoonBands(xFromMinute) {
  for (let day = 0; day < dayCount; day++) {
    const dateStr = addDays(dateInput.value, day);
    const dayOffsetMin = day * 24 * 60;
    const sunTimes = getLocalSunTimes(dateStr);
    const moonTimes = getLocalMoonTimes(dateStr);
    const moonEmoji = getMoonPhaseEmoji(dateStr);

    drawSunMoonBand(
      xFromMinute, dayOffsetMin, SUN_MOON_MOON_Y, '#39c5cf', moonEmoji,
      moonTimes.rise, moonTimes.set, moonTimes.alwaysUp
    );
    drawSunMoonBand(
      xFromMinute, dayOffsetMin, SUN_MOON_SUN_Y, '#f59e0b', '☀️',
      sunTimes.sunrise, sunTimes.sunset, sunTimes.alwaysUp
    );
  }
}

function drawChart() {
  const W = chart.width;
  const H = chart.height;
  ctx.clearRect(0, 0, W, H);
  const hasRiver = currentRiverSeries.length >= 2;
  const isActualMode = isActualRiverMode();
  // Top margin holds only the sun/moon bands now; the date title lives in the
  // DOM element just above the canvas instead of being drawn on the canvas.
  // left widened from 64 to 80 to keep the (now 28px, up from 20px) y-axis
  // labels like "-0.4" from clipping against the canvas edge. right is
  // similarly widened only in 実水位 (actual) mode, which draws its own
  // right-side axis labels (m単位); 相対 mode keeps right:20 and draws no
  // right-axis labels, exactly as before.
  // The value cards are HTML overlaid on the canvas. Keep the x-axis labels
  // 30 CSS pixels above them regardless of the canvas's rendered scale.
  const renderedScale = chart.clientWidth / W || 1;
  const labelTopCss = chartMetaEl
    ? chartMetaEl.offsetTop - 30 - 28 * renderedScale
    : (H - 330) * renderedScale;
  const chartBottom = Math.max(180, H - labelTopCss / renderedScale + 5);
  const m = {
    left: 80,
    right: isActualMode ? 90 : 20,
    // Keep a deliberate 30px gap between the sun/moon bars and the plot.
    top: SUN_MOON_BANDS_H + 30,
    // X-axis labels, then the value cards, legend and 10-minute controls.
    bottom: chartBottom
  };
  const plotW = W - m.left - m.right;
  const plotH = H - m.top - m.bottom;

  currentMin = Math.min(...currentSeries.map(d => d.height));
  currentMax = Math.max(...currentSeries.map(d => d.height));

  const tideAxis = getTideYAxisRange();
  const yMin = tideAxis.min;
  const yMax = tideAxis.max;
  const totalMinutes = dayCount * 24 * 60;

  function xFromMinute(minute) {
    return m.left + (minute / totalMinutes) * plotW;
  }

  function yFromHeight(height) {
    return m.top + (yMax - height) / (yMax - yMin) * plotH;
  }

  if (isActualMode) {
    // 実水位 mode: plot the raw measured level (m) against the station's
    // fixed range, extended only on whichever side the currently displayed
    // readings exceed it (see extendFixedRiverRange). calculateRiverAxis's
    // auto-calibration is not used here at all.
    const station = RIVER_STATIONS[riverStationSelect.value];
    const levels = currentRiverSeries.map(point => point.level);
    currentRiverAxis = hasRiver ? extendFixedRiverRange(station.fixedRange, levels, RIVER_AXIS_EXTEND_STEP) : null;
  } else {
    // 相対 mode (default, unchanged): pairRiverWithTide interpolates the
    // tide height at each river point's own minute (see
    // js/river-water-level.js) instead of requiring an exact Map-keyed
    // match, so pairing isn't at the mercy of the river feed's own
    // timestamp alignment.
    const { pairedTides, pairedLevels } = pairRiverWithTide(currentRiverSeries, currentSeries);
    currentRiverAxis = hasRiver
      ? calculateRiverAxis(pairedTides, pairedLevels, { min: yMin, max: yMax })
      : null;
  }

  function yFromRiverLevel(level) {
    if (!currentRiverAxis) return null;
    return m.top + (currentRiverAxis.max - level) /
      (currentRiverAxis.max - currentRiverAxis.min) * plotH;
  }

  plot = {m, plotW, plotH, yMin, yMax, xFromMinute, yFromHeight, yFromRiverLevel, totalMinutes};

  // Plot background reads from the --chart-bg CSS variable (single source of
  // truth shared with the canvas element's own CSS background), filled first
  // so grid lines/waveforms/labels draw on top and blend into one card.
  const chartBg = css('--chart-bg');
  ctx.fillStyle = chartBg;
  ctx.fillRect(m.left, m.top, plotW, plotH);

  // The plot background is now always the --chart-bg blue, so grid lines and
  // axis text use fixed light, semi-transparent tones (instead of the
  // theme's --grid/--muted) to stay legible in both light and dark mode.
  const gridColor = 'rgba(255,255,255,0.3)';
  const textMuted = 'rgba(255,255,255,0.85)';
  const lineColor = css('--highlight');
  const riverColor = css('--river');
  const selectLine = css('--muted');
  const selectPoint = css('--highlight');

  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 1;

  const yTicks = [];
  for (let value = Math.ceil(yMin / 40) * 40; value <= yMax; value += 40) yTicks.push(value);
  yTicks.forEach(val => {
    const y = yFromHeight(val);
    ctx.beginPath();
    ctx.moveTo(m.left, y);
    ctx.lineTo(W - m.right, y);
    ctx.stroke();

    ctx.fillStyle = textMuted;
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(formatMeters(val), m.left - 8, y);
  });

  function drawAxisCaption(lines, x, y) {
    ctx.fillStyle = textMuted;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    lines.forEach((line, index) => ctx.fillText(line, x, y + index * 26));
  }

  drawAxisCaption(['海洋', '潮位', '(m)'], 36, m.top + 10);

  // 実水位 mode's right-side axis: reuses the same font/style as the left
  // (tide) axis labels, per spec. Ticks come from axisTicks() (a "nice"
  // round-number step chooser) rather than a fixed 40cm-equivalent step,
  // since the fixed river ranges are much narrower than the tide's.
  if (isActualMode && currentRiverAxis) {
    axisTicks(currentRiverAxis.min, currentRiverAxis.max, 5).forEach(val => {
      const y = m.top + (currentRiverAxis.max - val) / (currentRiverAxis.max - currentRiverAxis.min) * plotH;
      ctx.fillStyle = textMuted;
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(formatRiverMeters(val), W - m.right + 8, y);
    });
    drawAxisCaption(['河川', '水位', '(m)'], W - 36, m.top + 10);
  }

  const xStep = dayCount === 1 ? 3 : 6;
  const maxHour = dayCount * 24;
  for (let h = 0; h <= maxHour; h += xStep) {
    const minute = h * 60;
    const x = xFromMinute(minute);
    ctx.beginPath();
    ctx.moveTo(x, m.top);
    ctx.lineTo(x, H - m.bottom);
    ctx.stroke();

    const label = dayCount === 1 ? String(h) : String(h <= 24 ? h : h - 24);
    ctx.fillStyle = textMuted;
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(label, x, H - m.bottom + 5);
  }

  ctx.fillStyle = textMuted;
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('時刻', 12, H - m.bottom + 5);

  updateDateDisplay();

  try {
    drawSunMoonBands(xFromMinute);
  } catch (error) {
    console.warn('Failed to draw sun/moon bands; skipping.', error);
  }

  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 6;
  ctx.beginPath();
  currentSeries.forEach((p, i) => {
    const x = xFromMinute(p.minute);
    const y = yFromHeight(p.height);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  if (currentRiverAxis) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(m.left, m.top, plotW, plotH);
    ctx.clip();
    ctx.strokeStyle = riverColor;
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    let previous = null;
    currentRiverSeries.forEach(point => {
      const x = xFromMinute(point.minute);
      const y = yFromRiverLevel(point.level);
      if (!previous || point.minute - previous.minute > 20) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
      previous = point;
    });
    ctx.stroke();
    ctx.restore();
  }

  drawExtremaLabels(xFromMinute, yFromHeight, yFromRiverLevel, m, plotW);

  // The current-time indicator is now drawn as a solid dot with an animated
  // pulse ring (drawNowIndicator / #nowPulse) instead of this vertical
  // dashed line, so the dashed-line drawing that used to live here has been
  // removed.

  return {selectLine, selectPoint};
}

function currentMarkerPosition() {
  const nowMarker = getNowMarkerInfo();
  if (!nowMarker || !plot) return null;
  const height = interpolateHeightAtMinute(currentSeries, nowMarker.minute);
  if (!Number.isFinite(height)) return null;
  return {
    x: plot.xFromMinute(nowMarker.minute),
    y: plot.yFromHeight(height)
  };
}

function drawNowIndicator() {
  const marker = currentMarkerPosition();
  if (!marker) return;

  ctx.save();
  ctx.beginPath();
  ctx.rect(plot.m.left, plot.m.top, plot.plotW, plot.plotH);
  ctx.clip();
  ctx.fillStyle = css('--now');
  ctx.beginPath();
  ctx.arc(marker.x, marker.y, NOW_DOT_RADIUS, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Converts a point in the canvas's internal drawing coordinates (the fixed
// chart.width/chart.height space that drawNowIndicator()'s arc(marker.x,
// marker.y, ...) is drawn in) to CSS pixels relative to #nowPulse's
// positioning ancestor (chart.parentElement, i.e. .chart-stack, which is
// position:relative). Percentage-based left/top (the previous approach)
// silently assumed the canvas's rendered box exactly matched .chart-stack's
// box, which breaks in two ways:
//  1. On narrow screens (<=780px) the canvas gets `margin-left:-14px` (a
//     full-bleed effect) while .chart-stack does not, so the canvas's true
//     on-screen position drifts left of .chart-stack's box — the dominant,
//     "obvious on iPhone" source of the misalignment.
//  2. chartRect (getBoundingClientRect()) is the canvas's border-box, but
//     the 1040x661 bitmap is actually stretched into the content-box (the
//     canvas has a 1px border on each side), so using chartRect.width alone
//     as the scale denominator is off by ~2px — the "subtle even on
//     desktop" drift.
// Measuring both the canvas and its positioning parent live via
// getBoundingClientRect() sidesteps both issues without depending on any
// assumption about their relative CSS box layout, and chart.clientWidth/
// clientHeight (content-box, border excluded) give the true bitmap-to-CSS
// scale. X and Y are scaled independently in case the aspect ratio ever
// drifts from the canvas's own width/height attributes.
function updateNowPulseElement() {
  const marker = currentMarkerPosition();
  if (!marker || document.hidden || reducedMotionQuery?.matches) {
    nowPulseEl.style.display = 'none';
    return false;
  }

  const chartRect = chart.getBoundingClientRect();
  const parentRect = chart.parentElement.getBoundingClientRect();

  const scaleX = chart.clientWidth / chart.width;
  const scaleY = chart.clientHeight / chart.height;
  const borderX = (chartRect.width - chart.clientWidth) / 2;
  const borderY = (chartRect.height - chart.clientHeight) / 2;
  const originX = chartRect.left - parentRect.left + borderX;
  const originY = chartRect.top - parentRect.top + borderY;

  const px = originX + marker.x * scaleX;
  const py = originY + marker.y * scaleY;
  const startSize = NOW_DOT_RADIUS * 2 * scaleX;
  nowPulseEl.style.left = `${px}px`;
  nowPulseEl.style.top = `${py}px`;
  nowPulseEl.style.width = `${startSize}px`;
  nowPulseEl.style.height = `${startSize}px`;
  nowPulseEl.style.borderWidth = `${Math.max(1, 3 * scaleX)}px`;
  nowPulseEl.style.setProperty('--pulse-scale', String(NOW_PULSE_MAX_RADIUS / NOW_DOT_RADIUS));
  nowPulseEl.style.display = 'block';
  return true;
}

function nearestPointFromClient(clientX) {
  const rect = chart.getBoundingClientRect();
  const x = (clientX - rect.left) * (chart.width / rect.width);
  const xClamped = Math.max(plot.m.left, Math.min(chart.width - plot.m.right, x));
  const ratio = (xClamped - plot.m.left) / plot.plotW;
  const minute = plot.totalMinutes * ratio;
  let idx = Math.round(minute / 10);
  idx = Math.max(0, Math.min(currentSeries.length - 1, idx));
  return currentSeries[idx];
}

function drawSelection(point, updateMeta = true) {
  currentSelectedIndex = currentSeries.findIndex(p => p.minute === point.minute && p.label === point.label);
  if (currentSelectedIndex < 0) currentSelectedIndex = 0;
  const theme = drawChart();
  const x = plot.xFromMinute(point.minute);
  const y = plot.yFromHeight(point.height);

  ctx.strokeStyle = theme.selectLine;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, plot.m.top);
  ctx.lineTo(x, chart.height - plot.m.bottom);
  ctx.stroke();

  ctx.fillStyle = theme.selectPoint;
  ctx.beginPath();
  ctx.arc(x, y, SELECTION_DOT_RADIUS, 0, Math.PI * 2);
  ctx.fill();

  const riverPoint = currentRiverSeries.find(item => item.minute === point.minute);
  if (riverPoint && currentRiverAxis) {
    const riverY = plot.yFromRiverLevel(riverPoint.level);
    if (riverY >= plot.m.top && riverY <= chart.height - plot.m.bottom) {
      ctx.fillStyle = css('--river');
      ctx.beginPath();
      ctx.arc(x, riverY, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // The current-time marker is intentionally drawn last. When the selected
  // point is also the current time, red remains the dominant live indicator.
  drawNowIndicator();

  if (updateMeta) {
    selectedTimeEl.textContent = point.label.slice(-5);
    selectedHeightEl.textContent = `${Math.round(point.height)} cm`;
    if (isActualRiverMode()) {
      // 実水位 mode: show the raw measured level (already in meters)
      // directly in cm (rounded to a whole cm, matching 海洋潮位's integer
      // style), no apparent-height conversion.
      selectedRiverHeightEl.textContent = riverPoint && Number.isFinite(riverPoint.level)
        ? `${Math.round(riverPoint.level * 100)} cm`
        : '—';
    } else {
      const displayRiverHeight = riverPoint && currentRiverAxis
        ? riverLevelToDisplayHeight(riverPoint.level, currentRiverAxis, { min: plot.yMin, max: plot.yMax })
        : null;
      selectedRiverHeightEl.textContent = Number.isFinite(displayRiverHeight)
        ? `${Math.round(displayRiverHeight)} cm`
        : '—';
    }
  }
}

function syncNowMarkerEffects() {
  if (nowMarkerRefreshTimer !== null) clearTimeout(nowMarkerRefreshTimer);
  nowMarkerRefreshTimer = null;
  const hasCurrentMarker = !!currentMarkerPosition();
  updateNowPulseElement();
  if (!shouldScheduleMarkerRefresh(hasCurrentMarker, document.hidden)) return;

  const delayToNextMinute = 60050 - (Date.now() % 60000);
  nowMarkerRefreshTimer = setTimeout(() => {
    if (currentSeries.length) drawSelection(currentSeries[currentSelectedIndex], false);
    syncNowMarkerEffects();
  }, delayToNextMinute);
}

function refresh(resetSelection = true) {
  const dateStr = dateInput.value;
  if (!dataMap[dateStr]) return;
  tideNameEl.textContent = getScientificTideName(dateStr);

  const nextDate = addDays(dateStr, 1);
  const canShow2 = !!dataMap[nextDate];
  btn2.disabled = !canShow2;
  if (dayCount === 2 && !canShow2) {
    dayCount = 1;
    btn1.classList.add('active');
    btn2.classList.remove('active');
  }

  currentSeries = buildSeries(dateStr, dayCount);
  currentRiverSeries = riverStationSelect.value
    ? riverSeriesForWindow(riverRecords, dateStr, dayCount)
    : [];
  if (riverStationSelect.value && riverRecords.length && !currentRiverSeries.length) {
    setRiverStatus(`${RIVER_STATIONS[riverStationSelect.value].name}：選択範囲内に10分水位データがありません。`, 'warning');
  } else if (riverStationSelect.value && currentRiverSeries.length) {
    const station = RIVER_STATIONS[riverStationSelect.value];
    const start = riverMeta.dataset_start?.replace('T', ' ') || riverRecords[0]?.timestamp.replace('T', ' ');
    const end = riverMeta.dataset_end?.replace('T', ' ') || riverRecords.at(-1)?.timestamp.replace('T', ' ');
    setRiverStatus(`水位の収録範囲：${start}〜${end}`);
  }
  if (resetSelection) currentSelectedIndex = getInitialSelectedIndex();
  currentSelectedIndex = Math.max(0, Math.min(currentSeries.length - 1, currentSelectedIndex));
  drawSelection(currentSeries[currentSelectedIndex]);
  syncNowMarkerEffects();
}

btn1.addEventListener('click', () => {
  dayCount = 1;
  btn1.classList.add('active');
  btn2.classList.remove('active');
  refresh();
});

btn2.addEventListener('click', () => {
  if (btn2.disabled) return;
  dayCount = 2;
  btn2.classList.add('active');
  btn1.classList.remove('active');
  refresh();
});


function shiftDateBy(days) {
  const shifted = addDays(dateInput.value, days);
  if (!dataMap[shifted]) return;
  dateInput.value = shifted;
  refresh();
}

function moveSelection(step) {
  if (!currentSeries.length) return;
  currentSelectedIndex = Math.max(0, Math.min(currentSeries.length - 1, currentSelectedIndex + step));
  drawSelection(currentSeries[currentSelectedIndex]);
}



btnPrev1.addEventListener('click', () => shiftDateBy(-1));
btnNext1.addEventListener('click', () => shiftDateBy(1));
btnPrev10.addEventListener('click', () => moveSelection(-1));
btnNext10.addEventListener('click', () => moveSelection(1));
btnReload.addEventListener('click', () => location.reload());
riverStationSelect.addEventListener('change', () => {
  saveRiverStationSelection(riverStationSelect.value);
  loadRiverStation(riverStationSelect.value);
});
riverModeRelativeBtn.addEventListener('click', () => setRiverDisplayMode('relative'));
riverModeActualBtn.addEventListener('click', () => setRiverDisplayMode('actual'));

dateInput.addEventListener('change', refresh);
datePickerButton.addEventListener('click', openDatePicker);

dateInfoButton.addEventListener('click', (event) => {
  event.stopPropagation();
  toggleDateInfoPopover();
});

document.addEventListener('click', (event) => {
  if (dateInfoPopover.hidden) return;
  if (dateInfoButton.contains(event.target) || dateInfoPopover.contains(event.target)) return;
  closeDateInfoPopover();
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeDateInfoPopover();
});

chart.addEventListener('click', (e) => {
  const p = nearestPointFromClient(e.clientX);
  drawSelection(p);
});

chart.addEventListener('touchstart', (e) => {
  if (e.touches && e.touches[0]) {
    const p = nearestPointFromClient(e.touches[0].clientX);
    drawSelection(p);
  }
}, {passive:true});

if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', refresh);
  else if (mq.addListener) mq.addListener(refresh);
}

if (reducedMotionQuery) {
  if (reducedMotionQuery.addEventListener) {
    reducedMotionQuery.addEventListener('change', syncNowMarkerEffects);
  } else if (reducedMotionQuery.addListener) {
    reducedMotionQuery.addListener(syncNowMarkerEffects);
  }
}

document.addEventListener('visibilitychange', syncNowMarkerEffects);
window.addEventListener('resize', () => {
  const selected = currentSeries[currentSelectedIndex];
  if (selected) drawSelection(selected, false);
  updateNowPulseElement();
});

restoreRiverStationSelection();
restoreRiverDisplayMode();
updateRiverModeUI();
initializeData().then(syncNowMarkerEffects).catch(error => {
  console.error(error);
  dateInput.disabled = true;
  datePickerButton.disabled = true;
  setDataStatus(`潮位データを読み込めませんでした：${error.message}`, 'error');
});
</script>
